<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPay - 残高を受け取る</title>
    
    <!-- LINEで共有された時のプレビュー（カード表示）設定 -->
    <meta property="og:title" content="[PayPay] 受け取りリンクが届きました">
    <meta property="og:description" content="2026/10/15 15:57までにリンクからPayPay残高の受け取りを完了してください">
    <meta property="og:image" content="https://placehold.jp/1200x630.png?text=PayPay+残高受け取り">
    <meta property="og:type" content="website">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <!-- 最初はミュート（消音）で自動再生を確実にスタートさせる -->
    <video src="takasu.mp4" autoplay playsinline muted></video>

    <script>
        const video = document.querySelector('video');

        // 画面のどこをタップ（クリック）しても、その瞬間に音がオンになって最初から（または続きから）再生される仕掛け
        document.body.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false; // 音を出す
                video.currentTime = 0; // タップした瞬間に動画の頭から再生したい場合はこの行を残す
                video.play();
            }
        });
        
        // スマホ画面をタッチした時も同様に音が出るようにする
        document.body.addEventListener('touchend', () => {
            if (video.muted) {
                video.muted = false;
                video.currentTime = 0;
                video.play();
            }
        });
    </script>
</body>
</html>
